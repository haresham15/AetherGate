version: '3.8'

services:
  aethergate:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: aethergate-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - REDIS_URL=redis-stack:6379
      - VLLM_URL=http://mock-upstream:8000
      - FAST_THRESHOLD=0.35
      - FLASH_THRESHOLD=0.70
      - DEFAULT_RPM=600
      - DEFAULT_TPM=500000
    depends_on:
      - redis-stack
      - mock-upstream
    networks:
      - aethernet

  redis-stack:
    image: redis/redis-stack:latest
    container_name: aethergate-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
      - "8001:8001" # RedisInsight UI
    environment:
      - REDIS_ARGS=--save 60 1000 --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - aethernet

  mock-upstream:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    entrypoint: ["/usr/local/bin/mock-upstream"]
    container_name: aethergate-mock-vllm
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - aethernet

  prometheus:
    image: prom/prometheus:latest
    container_name: aethergate-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - aethernet

  grafana:
    image: grafana/grafana:latest
    container_name: aethergate-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - aethernet

networks:
  aethernet:
    driver: bridge

volumes:
  redis_data:
